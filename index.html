<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>McDonald's｜每一口，都是熟悉的快樂</title>
    <style>
        :root {
            --mcd-red: #DA291C;
            --mcd-yellow: #FFC72C;
            --mcd-dark: #27251F;
            --mcd-cream: #FFFDF8;
            --mcd-gray: #6B6B6B;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }
        body {
            font-family: "Helvetica Neue", Arial, "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--mcd-cream);
            color: var(--mcd-dark);
            line-height: 1.7;
        }
        /* 導覽列 */
        header {
            position: sticky;
            top: 0;
            background: rgba(255, 253, 248, 0.95);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 5%;
            border-bottom: 1px solid rgba(0,0,0,0.06);
            z-index: 100;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--mcd-red);
            text-decoration: none;
            letter-spacing: -0.5px;
        }
        .logo span {
            color: var(--mcd-yellow);
        }
        nav {
            display: flex;
            gap: 2rem;
            align-items: center;
        }
        nav a {
            text-decoration: none;
            color: var(--mcd-dark);
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s;
        }
        nav a:hover {
            color: var(--mcd-red);
        }
        .nav-cta {
            background-color: var(--mcd-yellow);
            color: var(--mcd-dark);
            padding: 0.5rem 1.2rem;
            border-radius: 50px;
            font-weight: 700;
        }
        .nav-cta:hover {
            background-color: var(--mcd-red);
            color: #fff;
        }

        /* 主視覺區（左右雙欄含圖片） */
        .hero {
            min-height: 85vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 4rem 10%;
            background: linear-gradient(135deg, #FFFDF8 55%, #FFF3D1 100%);
        }
        .hero-container {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 3rem;
            align-items: center;
        }
        .hero-tag {
            font-size: 0.85rem;
            letter-spacing: 2px;
            color: var(--mcd-red);
            font-weight: 700;
            margin-bottom: 1rem;
        }
        .hero h1 {
            font-size: clamp(3rem, 6vw, 5rem);
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            color: var(--mcd-dark);
        }
        .hero h1 span {
            color: var(--mcd-red);
        }
        .hero p {
            font-size: 1.3rem;
            color: var(--mcd-gray);
            margin-bottom: 2.5rem;
            max-width: 480px;
        }
        .hero-img-wrap {
            position: relative;
        }
        .hero-img-wrap img {
            width: 100%;
            height: 440px;
            object-fit: cover;
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(218, 41, 28, 0.15);
        }
        .btn-primary {
            display: inline-block;
            background-color: var(--mcd-red);
            color: #fff;
            padding: 1rem 2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            width: fit-content;
            transition: transform 0.2s, background 0.2s;
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            background-color: #b81d13;
        }
        .hero-footer {
            margin-top: 4rem;
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: var(--mcd-gray);
            border-top: 1px solid rgba(0,0,0,0.08);
            padding-top: 1.5rem;
        }

        /* 通用區塊設定 */
        section {
            padding: 6rem 10%;
        }
        .section-num {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--mcd-red);
            margin-bottom: 0.5rem;
        }
        .section-en {
            font-size: 0.8rem;
            letter-spacing: 1.5px;
            color: var(--mcd-gray);
            margin-bottom: 1rem;
            text-transform: uppercase;
        }
        .section-title {
            font-size: 2.4rem;
            font-weight: 800;
            margin-bottom: 2rem;
            line-height: 1.3;
        }

        /* 01 品牌故事 */
        .story {
            background-color: #fff;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 4rem;
            align-items: center;
        }
        .story-content {
            font-size: 1.05rem;
            color: #444;
        }
        .story-content p {
            margin-bottom: 1.5rem;
        }
        .story-quote {
            margin-top: 2rem;
            font-style: italic;
            color: var(--mcd-red);
            font-weight: 700;
        }
        .story-img img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
        }

        /* 02 人氣餐點 */
        .menu-intro {
            color: var(--mcd-gray);
            margin-bottom: 3rem;
            font-size: 1.1rem;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2.2rem;
        }
        .card {
            background: #fff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.25s;
        }
        .card:hover {
            transform: translateY(-6px);
        }
        .card-img {
            width: 100%;
            height: 230px;
            object-fit: cover;
        }
        .card-body {
            padding: 1.8rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }
        .card-badge {
            display: inline-block;
            background: var(--mcd-yellow);
            color: var(--mcd-dark);
            font-size: 0.75rem;
            font-weight: 800;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            margin-bottom: 0.8rem;
            width: fit-content;
        }
        .card-sub {
            font-size: 0.85rem;
            color: var(--mcd-gray);
            margin-bottom: 0.3rem;
        }
        .card h3 {
            font-size: 1.4rem;
            margin-bottom: 0.8rem;
            color: var(--mcd-dark);
        }
        .card p {
            font-size: 0.95rem;
            color: #555;
            margin-bottom: 1.5rem;
        }
        .price {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--mcd-red);
            border-top: 1px dashed #eee;
            padding-top: 1rem;
        }

        /* 03 期間限定 */
        .seasonal {
            background-color: var(--mcd-dark);
            color: #fff;
            border-radius: 24px;
            margin: 0 5%;
            padding: 4.5rem 7%;
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 3rem;
            align-items: center;
        }
        .seasonal .section-en {
            color: #bbb;
        }
        .seasonal-tag {
            display: inline-block;
            background: var(--mcd-red);
            color: #fff;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 0.3rem 0.9rem;
            border-radius: 4px;
            margin-bottom: 1.2rem;
        }
        .seasonal p {
            color: #ddd;
            font-size: 1.05rem;
            margin-bottom: 2rem;
        }
        .countdown-box {
            background: rgba(255,255,255,0.08);
            padding: 1.2rem 1.8rem;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 1.8rem;
        }
        .countdown-title {
            font-size: 0.85rem;
            color: var(--mcd-yellow);
            margin-bottom: 0.3rem;
        }
        #countdown {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 1px;
        }
        .seasonal-img img {
            width: 100%;
            height: 360px;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }

        /* 04 門市資訊 */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }
        .info-item h3 {
            font-size: 1.1rem;
            color: var(--mcd-red);
            margin-bottom: 0.6rem;
        }
        .info-item p {
            color: #444;
            font-size: 0.95rem;
        }

        /* 頁尾 */
        footer {
            background: #1A1915;
            color: #999;
            text-align: center;
            padding: 4rem 5%;
            margin-top: 4rem;
        }
        footer .brand {
            color: #fff;
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }
        footer .slogan {
