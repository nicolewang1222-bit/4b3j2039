<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>McDonald's｜留一點快樂給日常</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Noto+Serif+TC:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #FAF7F2;
            --bg-card: #FFFFFF;
            --bg-soft: #F3ECE1;
            --text-dark: #231F1E;
            --text-muted: #78716C;
            --accent-red: #C8281E;
            --accent-gold: #E5A93B;
            --border-light: rgba(35, 31, 30, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-dark);
            font-family: "Plus Jakarta Sans", "Noto Serif TC", "PingFang TC", sans-serif;
            line-height: 1.8;
            -webkit-font-smoothing: antialiased;
        }

        .serif-en {
            font-family: "Cormorant Garamond", serif;
        }

        .serif-zh {
            font-family: "Noto Serif TC", serif;
        }

        /* 導覽列（還原 Mellow Hour 極簡頂部設計） */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(250, 247, 242, 0.92);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-light);
            padding: 1.2rem 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            font-family: "Cormorant Garamond", serif;
            font-size: 1.65rem;
            font-weight: 700;
            color: var(--text-dark);
            text-decoration: none;
            letter-spacing: -0.02em;
        }

        .brand-logo span {
            color: var(--accent-red);
        }

        .nav-links {
            display: flex;
            gap: 2.2rem;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-dark);
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            transition: opacity 0.2s;
        }

        .nav-links a:hover {
            opacity: 0.6;
        }

        .nav-action {
            border: 1px solid var(--text-dark);
            padding: 0.45rem 1.1rem;
            border-radius: 99px;
            font-size: 0.85rem;
            transition: all 0.25s !important;
        }

        .nav-action:hover {
            background-color: var(--accent-red);
            border-color: var(--accent-red);
            color: #fff !important;
            opacity: 1 !important;
        }

        /* 主視覺區（還原 Hero 雙欄雜誌排版與頁碼） */
        .hero {
            padding: 5rem 6% 3rem;
            min-height: 88vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .hero-main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
            margin: auto 0;
        }

        .hero-kicker {
            font-size: 0.78rem;
            letter-spacing: 0.22em;
            color: var(--accent-red);
            font-weight: 600;
            margin-bottom: 1.2rem;
            text-transform: uppercase;
        }

        .hero-title {
            font-family: "Cormorant Garamond", serif;
            font-size: clamp(3.5rem, 6.5vw, 5.8rem);
            font-weight: 600;
            line-height: 1.05;
            margin-bottom: 1.8rem;
            letter-spacing: -0.02em;
        }

        .hero-title span {
            color: var(--accent-red);
        }

        .hero-subtitle {
            font-family: "Noto Serif TC", serif;
            font-size: 1.45rem;
            color: var(--text-dark);
            margin-bottom: 2.5rem;
            line-height: 1.7;
            font-weight: 400;
        }

        .scroll-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            color: var(--text-dark);
            font-size: 0.92rem;
            padding-bottom: 0.4rem;
            border-bottom: 1px solid var(--text-dark);
            transition: color 0.2s, border-color 0.2s;
        }

        .scroll-btn:hover {
            color: var(--accent-red);
            border-color: var(--accent-red);
        }

        .hero-visual {
            position: relative;
        }

        .hero-visual img {
            width: 100%;
            height: 480px;
            object-fit: cover;
            border-radius: 16px;
            box-shadow: 0 24px 48px rgba(35, 31, 30, 0.08);
        }

        .hero-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 2rem;
            margin-top: 3rem;
            border-top: 1px solid var(--border-light);
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 0.08em;
        }

        /* 通用區塊標題結構（還原 01 / 02 / 03 / 04 編號系統） */
        section {
            padding: 6.5rem 6%;
            border-top: 1px solid var(--border-light);
        }

        .sec-header {
            margin-bottom: 3.5rem;
        }

        .sec-num {
            font-size: 0.78rem;
            letter-spacing: 0.2em;
            color: var(--accent-red);
            font-weight: 600;
            margin-bottom: 0.4rem;
        }

        .sec-en {
            font-size: 0.78rem;
            letter-spacing: 0.18em;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .sec-title {
            font-family: "Noto Serif TC", serif;
            font-size: clamp(1.9rem, 3.5vw, 2.6rem);
            font-weight: 600;
            line-height: 1.35;
        }

        /* 01 OUR LITTLE STORY */
        .story-grid {
            display: grid;
            grid-template-columns: 0.95fr 1.05fr;
            gap: 4.5rem;
            align-items: center;
        }

        .story-photo img {
            width: 100%;
            height: 440px;
            object-fit: cover;
            border-radius: 14px;
        }

        .story-text p {
            color: #4A4543;
            font-size: 1rem;
            margin-bottom: 1.5rem;
            line-height: 1.95;
        }

        .story-sign {
            font-family: "Cormorant Garamond", serif;
            font-style: italic;
            font-size: 1.35rem;
            color: var(--accent-red);
            margin-top: 2rem;
        }

        /* 02 THE EVERYDAY FAVORITES（經典三欄商品卡片） */
        .menu-lead {
            color: var(--text-muted);
            font-size: 1rem;
            margin-top: 0.8rem;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2.2rem;
        }

        .product-card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 18px 36px rgba(35, 31, 30, 0.06);
        }

        .product-img-box {
            position: relative;
            height: 250px;
            overflow: hidden;
        }

        .product-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .product-card:hover .product-img-box img {
            transform: scale(1.04);
        }

        .best-tag {
            position: absolute;
            top: 14px;
            left: 14px;
            background: rgba(250, 247, 242, 0.95);
            color: var(--text-dark);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            padding: 0.3rem 0.75rem;
            border-radius: 4px;
        }

        .product-info {
            padding: 1.8rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .product-caption {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
        }

        .product-name {
            font-family: "Noto Serif TC", serif;
            font-size: 1.35rem;
            font-weight: 600;
            margin-bottom: 0.9rem;
        }

        .product-desc {
            font-size: 0.92rem;
            color: #57534E;
            line-height: 1.8;
            margin-bottom: 1.6rem;
        }

        .product-price {
            font-family: "Cormorant Garamond", serif;
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--accent-red);
            padding-top: 1rem;
            border-top: 1px solid var(--border-light);
        }

        /* 03 A LITTLE SEASONAL MAGIC（還原季節限定雙欄與倒數區塊） */
        .seasonal-section {
            background-color: var(--bg-soft);
        }

        .seasonal-wrap {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        .season-badge {
            display: inline-block;
            border: 1px solid var(--accent-red);
            color: var(--accent-red);
            font-size: 0.72rem;
